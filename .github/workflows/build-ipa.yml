name: Build unsigned IPA

# Turns every push into a downloadable, unsigned .ipa.
# Unsigned builds need no Apple account, no certificates and no secrets — you
# re-sign with Sideloadly on your own PC using a free Apple ID.
#
# macOS runners are free on public repositories. On a private repo they draw from
# the monthly minutes allowance at a 10x multiplier, so keep this repo public.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Scowld (unsigned)
    # macOS 26 ships Xcode 26, which this app needs: it uses iOS 26 APIs such as
    # AVAudioSession.CategoryOptions.allowBluetoothHFP and SwiftUI's glass effects.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Build for device without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/Scowld.xcodeproj \
            -scheme Scowld \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package the app into a .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/Scowld.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Build product not found at $APP"
            find build/Build/Products -maxdepth 3 -name "*.app" || true
            exit 1
          fi
          rm -rf Payload Scowld-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr Scowld-unsigned.ipa Payload
          ls -lh Scowld-unsigned.ipa

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: Scowld-unsigned-ipa
          path: Scowld-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
